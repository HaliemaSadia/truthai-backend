<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090d16"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="256" y1="40" x2="256" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="160" y1="256" x2="352" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Shield Outline -->
  <path d="M256 56 C344 56, 424 88, 424 88 C424 88, 432 304, 256 456 C80 304, 88 88, 88 88 C88 88, 168 56, 256 56 Z" 
        fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- AI Eye Outer Ring -->
  <path d="M144 256 C144 256, 192 176, 256 176 C320 176, 368 256, 368 256 C368 256, 320 336, 256 336 C192 336, 144 256, 144 256 Z" 
        fill="none" stroke="url(#eyeGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pupil Outer -->
  <circle cx="256" cy="256" r="48" fill="none" stroke="#38bdf8" stroke-width="10" stroke-dasharray="16 8"/>

  <!-- Pupil Center Core -->
  <circle cx="256" cy="256" r="24" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="248" cy="248" r="8" fill="#ffffff"/>

  <!-- Tech Dots / Circuit accents -->
  <circle cx="256" cy="116" r="6" fill="#38bdf8"/>
  <line x1="256" y1="122" x2="256" y2="150" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="170" cy="256" r="5" fill="#38bdf8"/>
  <circle cx="342" cy="256" r="5" fill="#38bdf8"/>
</svg>
